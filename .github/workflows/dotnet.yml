name: Publicar aplicación .NET 8

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PROJECT_PATH: LAB14-JoseTincopaPaz/LAB14-JoseTincopaPaz.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar el SDK de .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore "$PROJECT_PATH"

      - name: Compilar en Release
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore

      - name: Publicar aplicación
        run: dotnet publish "$PROJECT_PATH" -c Release --no-build -o ./published

      - name: Guardar archivos publicados
        uses: actions/upload-artifact@v7
        with:
          name: publicacion-net8
          path: ./published/
          if-no-files-found: error
